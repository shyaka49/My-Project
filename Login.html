<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Access Your Account</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f1923 0%, #1a2840 60%, #0d2137 100%);
      padding: 2rem 1rem;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    /* Glow blobs */
    .blob-1 {
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29,158,117,0.18) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    .blob-2 {
      position: fixed;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(83,74,183,0.15) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1D9E75, #534AB7);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 22px;
      color: white;
      font-weight: 600;
    }

    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .logo-area p {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      font-weight: 300;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-bottom: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
      pointer-events: none;
    }

    .field input[type="email"],
    .field input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 11px 12px 11px 38px;
      font-size: 14px;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input[type="email"]::placeholder,
    .field input[type="password"]::placeholder {
      color: rgba(255,255,255,0.22);
    }

    .field input[type="email"]:focus,
    .field input[type="password"]:focus {
      border-color: #1D9E75;
      background: rgba(29,158,117,0.08);
    }

    .field input.error {
      border-color: #E24B4A !important;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      margin-top: 0.2rem;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #1D9E75;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: #5DCAA5;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #1D9E75 0%, #534AB7 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 1.2rem;
    }

    .btn-login:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: rgba(255,255,255,0.1);
    }

    .divider span {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px;
    }

    .social-row {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      flex: 1;
      padding: 9px;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .social-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    .register-row {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
    }

    .register-row a {
      color: #5DCAA5;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .register-row a:hover {
      text-decoration: underline;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 12px;
      background: rgba(29,158,117,0.15);
      border: 0.5px solid rgba(29,158,117,0.4);
      border-radius: 10px;
      color: #5DCAA5;
      font-size: 14px;
      margin-bottom: 1rem;
    }

    .error-msg {
      display: none;
      text-align: center;
      padding: 10px;
      background: rgba(226,75,74,0.12);
      border: 0.5px solid rgba(226,75,74,0.35);
      border-radius: 10px;
      color: #F09595;
      font-size: 13px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="blob-1"></div>
  <div class="blob-2"></div>

  <div class="wrapper">
    <div class="card">
      <div class="logo-area">
        <div class="logo-circle">&#9670;</div>
        <h1>Welcome back</h1>
        <p>Sign in to your account</p>
      </div>

      <div class="success-msg" id="successMsg">
        ✓ Login successful! Redirecting you...
      </div>

      <div class="error-msg" id="errorMsg">
        Please fill in both email and password before continuing.
      </div>

      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input type="email" id="emailInput" placeholder="hello@example.com" />
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="passInput" placeholder="••••••••" />
        </div>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" /> Remember me
        </label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>

      <button class="btn-login" onclick="handleLogin()">Sign in</button>

      <div class="divider"><span>or</span></div>

      <div class="social-row">
        <button class="social-btn" onclick="handleSocial('Google')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button class="social-btn" onclick="handleSocial('Facebook')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <div class="register-row">
        Don't have an account? <a href="#">Create account</a>
      </div>
    </div>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById('emailInput');
      const pass = document.getElementById('passInput');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      email.classList.remove('error');
      pass.classList.remove('error');

      if (!email.value || !pass.value) {
        errorMsg.style.display = 'block';
        if (!email.value) email.classList.add('error');
        if (!pass.value) pass.classList.add('error');
        setTimeout(() => {
          email.classList.remove('error');
          pass.classList.remove('error');
          errorMsg.style.display = 'none';
        }, 2000);
        return;
      }

      successMsg.style.display = 'block';
      // Optional: auto-hide success message after 2.5 seconds
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 2500);
    }

    function handleSocial(provider) {
      alert('Login with ' + provider + ' — opening authentication...');
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
