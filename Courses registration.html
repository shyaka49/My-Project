<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CourseCanvas | Registration with Stunning Images</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* CRYSTAL CLEAR BACKGROUND IMAGE - high quality education/student image */
            background-image: url('https://images.pexels.com/photos/267885/pexels-photo-267885.jpeg?auto=compress&cs=tinysrgb&w=1920&h=1080&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* Lighter overlay to keep image visible */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            pointer-events: none;
            z-index: 0;
        }

        .form-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 2rem;
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 2;
            position: relative;
        }

        /* Header with decorative image */
        .form-header {
            background: linear-gradient(135deg, #FF6A88 0%, #FF99AC 55%, #FFC3CF 100%);
            padding: 2rem 2.2rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Decorative header image overlay */
        .header-image {
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 100%;
            opacity: 0.15;
            background-image: url('https://images.pexels.com/photos/5212345/pexels-photo-5212345.jpeg?auto=compress&cs=tinysrgb&w=400&h=300&fit=crop');
            background-size: cover;
            background-position: center;
            pointer-events: none;
        }

        .form-header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .form-header h1 i {
            background: rgba(255,255,240,0.25);
            padding: 10px;
            border-radius: 60px;
            font-size: 1.8rem;
        }

        .form-header p {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.95;
            max-width: 80%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .registration-form {
            padding: 2.2rem 2.2rem 2.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem 2rem;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a3b2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group label i {
            color: #FF6A88;
            font-size: 0.9rem;
            width: 18px;
        }

        input, select, textarea {
            font-family: 'Inter', sans-serif;
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 20px;
            border: 1.5px solid #f0e2d8;
            background-color: #fffefc;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
            color: #2c221b;
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #FF8BA7;
            box-shadow: 0 0 0 4px rgba(255, 107, 136, 0.2);
            background-color: white;
        }

        .inline-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: center;
            margin-top: 0.2rem;
        }

        .checkbox-label, .radio-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            color: #3a2c22;
        }

        .checkbox-label input, .radio-label input {
            width: 18px;
            height: 18px;
            accent-color: #FF6A88;
            margin: 0;
            padding: 0;
        }

        /* Course selection cards with icons */
        .course-selection-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 6px;
        }

        .course-card {
            flex: 1 1 170px;
            background: #fef8f4;
            border-radius: 24px;
            padding: 0.7rem 1rem;
            border: 1.5px solid #ffe3d6;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .course-card.selected {
            background: #ffe9f0;
            border-color: #FF6A88;
            box-shadow: 0 4px 12px rgba(255, 106, 136, 0.15);
        }

        .course-card input {
            width: 20px;
            height: 20px;
            margin: 0;
            accent-color: #FF6A88;
        }

        .course-card label {
            font-weight: 500;
            color: #4d3426;
            cursor: pointer;
            flex: 1;
            font-size: 0.9rem;
        }

        /* IMAGE GALLERY SECTION - NEW VISIBLE IMAGES */
        .image-showcase {
            margin: 1.5rem 0 1rem;
            padding: 1rem;
            background: linear-gradient(135deg, #fff5f0, #fff0f5);
            border-radius: 28px;
            text-align: center;
        }

        .image-showcase h3 {
            color: #FF6A88;
            font-size: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .image-grid {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .image-card {
            flex: 1;
            min-width: 120px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
        }

        .image-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        .image-card p {
            padding: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: white;
            color: #FF6A88;
        }

        .submit-btn {
            background: linear-gradient(95deg, #FF6A88, #FF9E7A);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 1rem 1.8rem;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.3px;
            margin-top: 0.8rem;
            box-shadow: 0 8px 18px rgba(255, 106, 136, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #ff5a7a, #ff8c62);
            box-shadow: 0 12px 22px rgba(255, 106, 136, 0.5);
        }

        .submit-btn:active {
            transform: translateY(2px);
        }

        hr {
            margin: 1rem 0 1.2rem;
            border: none;
            height: 2px;
            background: linear-gradient(to right, #ffe0d4, #ffb7c3, #ffe0d4);
        }

        .message-area {
            margin-top: 1.5rem;
            background: #eff9f0;
            border-radius: 28px;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2d6a4f;
            border-left: 7px solid #52b788;
            display: none;
        }

        .message-area.show {
            display: block;
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23FF6A88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1rem;
        }

        small.hint {
            font-size: 0.7rem;
            color: #b28b7a;
            margin-top: 4px;
        }

        @media (max-width: 750px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .full-width {
                grid-column: span 1;
            }
            .form-header h1 {
                font-size: 1.6rem;
            }
            .registration-form {
                padding: 1.5rem;
            }
            .course-card {
                flex: 1 1 100%;
            }
            .image-card {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <div class="header-image"></div>
        <h1>
            <i class="fas fa-graduation-cap"></i> 
            Course Registration
            <i class="fas fa-image"></i>
        </h1>
        <p>Register with us — beautiful learning journey awaits with stunning visuals!</p>
    </div>
    
    <div class="registration-form">
        <form id="regForm" action="#" method="post">
            <div class="form-grid">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Full Name *</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Alex Morgan" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="hello@coursecanvas.com" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-calendar-alt"></i> Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-globe"></i> Country / Region</label>
                    <select id="country" name="country">
                        <option value="">Select country</option>
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="India">India</option>
                        <option value="Germany">Germany</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-chalkboard-user"></i> Education Level</label>
                    <select id="education" name="education">
                        <option value="">Select level</option>
                        <option value="highschool">High School</option>
                        <option value="undergrad">Undergraduate</option>
                        <option value="postgrad">Postgraduate</option>
                        <option value="professional">Professional / Diploma</option>
                    </select>
                </div>

                <div class="full-width input-group">
                    <label><i class="fas fa-book-open"></i> Select Courses (pick multiple) *</label>
                    <div class="course-selection-grid" id="courseGroup">
                        <div class="course-card" data-course="uiux">
                            <input type="checkbox" id="course_uiux" name="courses" value="UI/UX Design">
                            <label for="course_uiux">🎨 UI/UX Design</label>
                        </div>
                        <div class="course-card" data-course="webdev">
                            <input type="checkbox" id="course_webdev" name="courses" value="Full-Stack Web Dev">
                            <label for="course_webdev">💻 Full-Stack Web Dev</label>
                        </div>
                        <div class="course-card" data-course="datasci">
                            <input type="checkbox" id="course_datasci" name="courses" value="Data Science & AI">
                            <label for="course_datasci">📊 Data Science & AI</label>
                        </div>
                        <div class="course-card" data-course="marketing">
                            <input type="checkbox" id="course_marketing" name="courses" value="Digital Marketing">
                            <label for="course_marketing">📈 Digital Marketing</label>
                        </div>
                        <div class="course-card" data-course="design">
                            <input type="checkbox" id="course_design" name="courses" value="Graphic Design">
                            <label for="course_design">🖌️ Graphic Design</label>
                        </div>
                        <div class="course-card" data-course="business">
                            <input type="checkbox" id="course_business" name="courses" value="Business Analytics">
                            <label for="course_business">📊 Business Analytics</label>
                        </div>
                    </div>
                    <small class="hint"><i class="fas fa-info-circle"></i> Select at least one course</small>
                </div>

                <!-- VISIBLE IMAGES SECTION - CLEARLY SHOWING PICTURES -->
                <div class="full-width image-showcase">
                    <h3><i class="fas fa-images"></i> Our Campus & Learning Spaces <i class="fas fa-heart" style="color: #FF6A88;"></i></h3>
                    <div class="image-grid">
                        <div class="image-card">
                            <img src="https://images.pexels.com/photos/207691/pexels-photo-207691.jpeg?auto=compress&cs=tinysrgb&w=300&h=150&fit=crop" alt="Modern Library">
                            <p>📚 Modern Library</p>
                        </div>
                        <div class="image-card">
                            <img src="https://images.pexels.com/photos/256490/pexels-photo-256490.jpeg?auto=compress&cs=tinysrgb&w=300&h=150&fit=crop" alt="Tech Lab">
                            <p>💻 Tech Lab</p>
                        </div>
                        <div class="image-card">
                            <img src="https://images.pexels.com/photos/238779/pexels-photo-238779.jpeg?auto=compress&cs=tinysrgb&w=300&h=150&fit=crop" alt="Study Group">
                            <p>👥 Collaborative Space</p>
                        </div>
                        <div class="image-card">
                            <img src="https://images.pexels.com/photos/301926/pexels-photo-301926.jpeg?auto=compress&cs=tinysrgb&w=300&h=150&fit=crop" alt="Online Learning">
                            <p>🌐 Virtual Classrooms</p>
                        </div>
                    </div>
                </div>

                <div class="full-width input-group">
                    <label><i class="fas fa-comment-dots"></i> Additional Notes / Questions</label>
                    <textarea id="notes" name="notes" placeholder="Anything you'd like us to know? (e.g., preferred learning mode, special accommodations)"></textarea>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-laptop-code"></i> Preferred Learning Mode</label>
                    <div class="inline-options">
                        <label class="radio-label">
                            <input type="radio" name="learningMode" value="Online LIVE"> <span>Online LIVE</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="learningMode" value="In-Person"> <span>In-Person</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="learningMode" value="Hybrid"> <span>Hybrid</span>
                        </label>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-bell"></i> Receive updates & offers</label>
                    <div class="inline-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes"> Subscribe to newsletter
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" value="agree"> I agree to the <span style="color:#FF6A88;">Terms & Policy</span> *
                        </label>
                    </div>
                </div>
            </div>
            
            <hr>
            
            <button type="submit" class="submit-btn" id="submitBtn"><i class="fas fa-check-circle"></i> Register Now →</button>
            <div id="formMessage" class="message-area"></div>
        </form>
    </div>
</div>

<script>
    (function() {
        // Course card interactive highlight
        const courseCards = document.querySelectorAll('.course-card');
        const checkboxes = document.querySelectorAll('.course-card input[type="checkbox"]');
        
        function updateCardHighlight(card, isChecked) {
            if(isChecked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        }
        
        checkboxes.forEach(checkbox => {
            const parentCard = checkbox.closest('.course-card');
            if(parentCard) {
                updateCardHighlight(parentCard, checkbox.checked);
                checkbox.addEventListener('change', function(e) {
                    updateCardHighlight(parentCard, this.checked);
                    e.stopPropagation();
                });
                parentCard.addEventListener('click', function(e) {
                    if(e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
                    const cb = parentCard.querySelector('input[type="checkbox"]');
                    if(cb) {
                        cb.checked = !cb.checked;
                        const changeEvent = new Event('change', { bubbles: true });
                        cb.dispatchEvent(changeEvent);
                        updateCardHighlight(parentCard, cb.checked);
                    }
                });
            }
        });
        
        const form = document.getElementById('regForm');
        const messageDiv = document.getElementById('formMessage');
        
        function showMessage(msg, isError = false) {
            messageDiv.textContent = msg;
            messageDiv.classList.add('show');
            if(isError) {
                messageDiv.style.background = "#ffe6e5";
                messageDiv.style.borderLeftColor = "#e63946";
                messageDiv.style.color = "#b91c1c";
            } else {
                messageDiv.style.background = "#e3f7ec";
                messageDiv.style.borderLeftColor = "#2ecc71";
                messageDiv.style.color = "#1f6e43";
            }
            setTimeout(() => {
                if(messageDiv.classList.contains('show')) {
                    setTimeout(() => {
                        messageDiv.classList.remove('show');
                    }, 3500);
                }
            }, 100);
        }
        
        function clearMessage() {
            messageDiv.classList.remove('show');
        }
        
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            clearMessage();
            
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const selectedCourses = Array.from(document.querySelectorAll('input[name="courses"]:checked')).map(cb => cb.value);
            const termsCheck = document.getElementById('terms').checked;
            
            if(fullname === "") {
                showMessage("✨ Please enter your full name.", true);
                document.getElementById('fullname').focus();
                return;
            }
            if(email === "" || !email.includes('@') || !email.includes('.')) {
                showMessage("📧 Provide a valid email address (e.g., name@example.com).", true);
                document.getElementById('email').focus();
                return;
            }
            if(selectedCourses.length === 0) {
                showMessage("📚 Oops! Please select at least one course to register.", true);
                return;
            }
            if(!termsCheck) {
                showMessage("⚠️ You must agree to the Terms & Policy to proceed.", true);
                return;
            }
            
            const learningMode = document.querySelector('input[name="learningMode"]:checked');
            const modeText = learningMode ? learningMode.value : "Not specified";
            const newsletterChecked = document.getElementById('newsletter').checked;
            let courseList = selectedCourses.join(', ');
            
            let successMsg = `🎉 Registration successful, ${fullname}! <br> 📖 Courses: ${courseList}. <br> 💡 Learning mode: ${modeText}. `;
            if(newsletterChecked) successMsg += ` You'll receive updates via ${email}.`;
            else successMsg += ` You have opted out from newsletters.`;
            successMsg += `<br><span style="font-size:0.8rem;">✅ Welcome to our beautiful campus! Check your email for confirmation.</span>`;
            
            messageDiv.innerHTML = successMsg;
            messageDiv.style.background = "#E8F3ED";
            messageDiv.style.borderLeftColor = "#40C9A2";
            messageDiv.style.color = "#1b4d3e";
            messageDiv.classList.add('show');
            
            console.log({
                fullname,
                email,
                courses: selectedCourses,
                learningMode: modeText,
                newsletter: newsletterChecked
            });
            
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    })();
</script>
</body>
</html>
